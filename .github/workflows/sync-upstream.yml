name: sync-upstream

on:
  schedule:
    - cron: '17 2 * * *'  # daily 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward mirror oh-3.44.9-dev
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream and push mirror (fast-forward only)
        run: |
          set -euo pipefail
          git init -q m && cd m
          git remote add upstream https://gitcode.com/CPF-Flutter/flutter_flutter.git
          ok=0
          for i in 1 2 3; do
            if timeout 600 git fetch --no-tags upstream oh-3.44.9-dev; then ok=1; break; fi
            echo "fetch retry $i"; sleep 30
          done
          [ "$ok" = 1 ]
          tip=$(git rev-parse FETCH_HEAD)
          echo "upstream tip: $tip"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 非快进会被拒绝 = 镜像分支被本地改动污染，人工介入
          git push origin "$tip":refs/heads/oh-3.44.9-dev
